name: Deploy NestFinder to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Deploy Firebase function and database rules
        id: firebase-deploy
        continue-on-error: true
        run: |
          npm install -g firebase-tools
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > functions/.env
          # The Agent's voice. Without this secret the speak function deploys
          # but returns a config error, and the app falls back to on-screen
          # text only — degraded, not broken.
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> functions/.env
          cd functions && npm install && cd ..
          firebase deploy --only functions,database --token "${{ secrets.FIREBASE_TOKEN }}" --project nestfinderv3 --non-interactive

      - name: Report Firebase deploy result
        run: |
          if [ "${{ steps.firebase-deploy.outcome }}" = "success" ]; then
            echo "Firebase function + database rules deployed — AI proxy and security rules are active"
          else
            echo "WARNING: Firebase deploy FAILED — AI features and database security rules NOT updated"
            echo "         This also means the coming-soon page's email box CANNOT SAVE:"
            echo "         waitlist/ writes are denied until these rules deploy."
            echo ""
            echo "Most common causes:"
            echo "  1. Firebase project (nestfinderv3) is on Spark free plan — upgrade to Blaze at console.firebase.google.com"
            echo "  2. FIREBASE_TOKEN secret is expired — run: npx firebase-tools login:ci"
            echo "  3. Billing not set up on the Google Cloud project"
          fi

      - name: Stage the site files
        run: |
          # ── THE WEB APP IS OFFLINE (30 Aug 2026) ────────────────────────
          # The public site is the coming-soon page and the two legal pages
          # it links to. Nothing else. map.html, js/ and data/ are NOT
          # published, so the app is genuinely unreachable rather than
          # sitting behind an overlay anyone could bypass with devtools.
          #
          # A useful side effect: js/config.js no longer reaches the public
          # web at all, and neither does the ~1.5MB of transit/journey data.
          #
          # TO PUT THE APP BACK — nothing has been deleted, it is two lines:
          #     cp index.html map.html privacy.html terms.html _site/
          #     cp -R css js data design-system _site/
          # and drop the coming-soon copy below.
          #
          # Everything else in the repo (functions/, docs/, mobile/,
          # node_modules/, python scripts, configs) stays private, as before.
          mkdir -p _site
          cp coming-soon.html _site/index.html
          cp privacy.html terms.html _site/
          # The legal pages' only asset. They load no JavaScript at all.
          cp -R design-system _site/
          echo "Staged for deploy:" && ls -la _site

      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
