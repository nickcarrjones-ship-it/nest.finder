name: Deploy NestFinder to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Deploy Firebase function and database rules
        id: firebase-deploy
        continue-on-error: true
        run: |
          npm install -g firebase-tools
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > functions/.env
          # The Agent's voice. Without this secret the speak function deploys
          # but returns a config error, and the app falls back to on-screen
          # text only — degraded, not broken.
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> functions/.env
          cd functions && npm install && cd ..
          firebase deploy --only functions,database --token "${{ secrets.FIREBASE_TOKEN }}" --project nestfinderv3 --non-interactive

      - name: Stage the site files
        run: |
          # ── THE PUBLIC SITE ─────────────────────────────────────────────
          # The coming-soon page and the three legal pages it links to.
          # Nothing else — and since 31 Aug there is nothing else to
          # publish: the web app's source is gone from the repo.
          #
          # delete-account.html is not optional furniture: Google Play
          # requires a route to account deletion that works for somebody
          # who has already uninstalled the app, which means it has to be
          # on the public web rather than only in Settings.
          #
          # The web app was RETIRED on 31 Aug 2026 — index.html, map.html,
          # css/ and js/ are deleted, not merely unpublished. The last commit
          # where it was live is tagged `web-app-final`.
          #
          # Everything else in the repo (functions/, docs/, mobile/,
          # node_modules/, python scripts, configs) stays private, as before.
          mkdir -p _site
          cp coming-soon.html _site/index.html
          cp privacy.html terms.html delete-account.html _site/
          # The legal pages' only asset. They load no JavaScript at all.
          cp -R design-system _site/
          echo "Staged for deploy:" && ls -la _site

      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # LAST on purpose, and it FAILS THE RUN. The deploy step above keeps
      # continue-on-error so a broken Firebase deploy still lets the public
      # pages publish — but for a day that also meant a red deploy showed a
      # green tick, and every function change silently did not ship. A
      # firebase-admin peer conflict broke every deploy and nothing said so
      # until someone noticed a bug fix had no effect (2026-09-14).
      #
      # Placed after the Pages steps so they still run; exiting non-zero
      # here turns the run red without taking the site down with it.
      - name: Report Firebase deploy result
        if: always()
        run: |
          if [ "${{ steps.firebase-deploy.outcome }}" = "success" ]; then
            echo "Firebase functions + database rules deployed."
            exit 0
          fi
          echo "::error::Firebase deploy FAILED — functions and database rules were NOT updated."
          echo "The app is now running against the PREVIOUS server code and rules."
          echo ""
          echo "Most common causes:"
          echo "  1. A dependency conflict in functions/ — npm install fails during the build."
          echo "     Reproduce with: cd functions && npm install"
          echo "  2. FIREBASE_TOKEN secret expired — run: npx firebase-tools login:ci"
          echo "  3. Project on the Spark plan, or billing not set up"
          exit 1
